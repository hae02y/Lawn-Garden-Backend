name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Debug SSH endpoint
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          echo "runner_ip=$(curl -s https://api.ipify.org)"
          echo "ssh_host=$SSH_HOST"
          echo "ssh_port=$SSH_PORT"
          getent hosts "$SSH_HOST" || true
          nc -vz -w 5 "$SSH_HOST" "$SSH_PORT"

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          debug: true
          script: echo connected

      - name: Make Gradle wrapper executable
        run: echo "Using system Gradle on runner"

      - name: Build JAR
        run: gradle clean bootJar -x test

      - name: Verify build artifact
        run: |
          cp build/libs/lawngarden.jar build/libs/lawngarden-${{ github.sha }}.jar
          ls -l build/libs
          sha256sum build/libs/lawngarden-${{ github.sha }}.jar

      - name: Upload JAR to server staging dir
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: build/libs/lawngarden-${{ github.sha }}.jar
          target: /home/lawn
          strip_components: 2
          overwrite: true

      - name: Upload application configs
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: src/main/resources/application*.yml
          target: /home/lawn
          strip_components: 3
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            APP_HOME=/home/lawn
            SERVICE_NAME=lawngarden
            JAR_RELEASE_PATH="$APP_HOME/lawngarden-${{ github.sha }}.jar"
            JAR_LINK_PATH="$APP_HOME/lawngarden-current.jar"
            SERVICE_PATH="/etc/systemd/system/$SERVICE_NAME.service"

            if [ ! -f "$JAR_RELEASE_PATH" ]; then
              echo "missing jar: $JAR_RELEASE_PATH"
              ls -l "$APP_HOME"/*.jar || true
              exit 1
            fi
            sha256sum "$JAR_RELEASE_PATH"

            if [ -f "$APP_HOME/.env" ]; then
              set -a
              . "$APP_HOME/.env"
              set +a
            fi

            previous_target=""
            if [ -L "$JAR_LINK_PATH" ]; then
              previous_target="$(readlink -f "$JAR_LINK_PATH" || true)"
            fi
            ln -sfn "$JAR_RELEASE_PATH" "$JAR_LINK_PATH"

            cat > "$APP_HOME/$SERVICE_NAME.service" <<'EOF'
            [Unit]
            Description=Lawn Garden Backend Service
            After=network.target

            [Service]
            Type=simple
            User=lawn
            Group=lawn
            WorkingDirectory=/home/lawn
            EnvironmentFile=-/home/lawn/.env
            ExecStart=/usr/bin/java -jar /home/lawn/lawngarden-current.jar --spring.config.additional-location=file:/home/lawn/
            SuccessExitStatus=143
            Restart=always
            RestartSec=5
            StandardOutput=append:/home/lawn/lawngarden.log
            StandardError=append:/home/lawn/lawngarden.log

            [Install]
            WantedBy=multi-user.target
            EOF

            SUDO=""
            if [ "$(id -u)" -eq 0 ]; then
              SUDO=""
            elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              SUDO="sudo -n"
            else
              echo "this deploy requires root or passwordless sudo to manage systemctl"
              exit 1
            fi

            $SUDO mv "$APP_HOME/$SERVICE_NAME.service" "$SERVICE_PATH"
            $SUDO chown root:root "$SERVICE_PATH"
            $SUDO chmod 644 "$SERVICE_PATH"
            $SUDO systemctl daemon-reload
            $SUDO systemctl enable "$SERVICE_NAME"
            $SUDO systemctl restart "$SERVICE_NAME"

            startup_ok=false
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:8080/v3/api-docs" >/dev/null 2>&1; then
                startup_ok=true
                break
              fi

              sleep 2
            done

            if [ "$startup_ok" != "true" ]; then
              echo "application startup verification failed"
              $SUDO systemctl status "$SERVICE_NAME" --no-pager || true
              tail -n 200 "$APP_HOME/lawngarden.log" || true

              if [ -n "$previous_target" ] && [ -f "$previous_target" ]; then
                echo "rolling back to previous jar: $previous_target"
                ln -sfn "$previous_target" "$JAR_LINK_PATH"
                $SUDO systemctl restart "$SERVICE_NAME" || true
              fi

              exit 1
            fi

            echo "application startup verified"

            for old_jar in "$APP_HOME"/lawngarden-*.jar; do
              [ -e "$old_jar" ] || continue
              if [ "$old_jar" != "$JAR_RELEASE_PATH" ] && [ "$old_jar" != "$previous_target" ]; then
                rm -f "$old_jar"
              fi
            done
            rm -f "$APP_HOME/lawngarden.jar"
